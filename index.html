<style>

  --accent:#7cc596; --warn:#e3a35e; --ok:#7cc596; --bar:#3f6b4c;
  --brand:#1d4a2e; --brand-fg:#e5efe6; --brand-sub:#9fd0ae; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;

.wrap{max-width:760px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--surface)}

.btn.danger{background:transparent;border:1px solid var(--yama);color:var(--yama)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap}

  padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90%}
.mrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

html,body{margin:0}
:root{color-scheme:light}
header.top{padding-top:calc(14px + env(safe-area-inset-top,0px))}

</style>

<script>

const CLOSED_DAYS=[3];
const WD=['日','月','火','水','木','金','土'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const man=n=>(n/10000).toFixed(n>=1e6?0:1)+'万';

const staffName=id=>(STAFF.find(s=>s.id===id)||{}).name||'';
const payLabel=id=>(PAY.find(p=>p.id===id)||{}).label||'';
const TODAY=ymd(new Date());
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};

function defaultMenus(){

  {id:'cut',cat:'カット',name:'カット',price:2640,options:[SH]},

  {id:'hige',cat:'脱毛・フェイシャル',name:'脱毛 ヒゲ',price:4180,options:[]},
  {id:'eri',cat:'脱毛・フェイシャル',name:'脱毛 えりあし',price:2090,options:[]},
  {id:'waki',cat:'脱毛・フェイシャル',name:'脱毛 わき',price:3080,options:[]},
  {id:'arm',cat:'脱毛・フェイシャル',name:'脱毛 手・腕',price:5280,options:[]},
  {id:'leg',cat:'脱毛・フェイシャル',name:'脱毛 足全体',price:6380,options:[]},
  {id:'facial',cat:'脱毛・フェイシャル',name:'フェイシャルリフトアップ',price:3520,options:[]},
]}
function defaultDiscounts(){return [
]}

function seed(){
  const S={menus:defaultMenus(),discounts:defaultDiscounts(),entries:[]};
  const combos=[[['cut'],{}],[['cut'],{cut:['sh']}],[['gray'],{gray:['cut','l1']}],[['color'],{color:['cut','l2']}],[['perm'],{}],[['kidcut'],{}],
    [['straight'],{}],[['cut','tradd'],{}],[['gray'],{gray:['l1']}],[['cosme'],{cosme:['pl']}],[['hige'],{}],[['bleach'],{bleach:['l2']}],[['cut'],{}],[['color'],{color:['cut','l3']}]];
  let r=7;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
  const start=new Date(new Date().getFullYear()-1,0,1);
  for(let d=new Date(start);ymd(d)<=TODAY;d.setDate(d.getDate()+1)){
    const ds=ymd(d);if(CLOSED_DAYS.includes(d.getDay()))continue;
    const wkend=d.getDay()===0||d.getDay()===6,season=1+0.18*Math.sin((d.getMonth()+1)/12*Math.PI*2);
    let n=Math.round((wkend?7:4.5)*season+rnd()*3-1);if(ds===TODAY)n=4;
    for(let k=0;k<n;k++){

async function offerFile(filename,data,fallbackText,okMsg){
  const type=filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':filename.endsWith('.csv')?'text/csv':'application/json';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});toast(okMsg);return true}
  }catch(e){if(e&&e.name==='AbortError'){toast('やめました');return false}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(okMsg);return true}catch(e){}
  openSheet(`<h3>コピーしてください<button class="iconbtn" data-act="close" aria-label="閉じる">✕</button></h3><p class="small muted" style="margin:0">下の中身を長押しして「すべて選択」→「コピー」してください。</p><textarea readonly style="min-height:220px" id="cpText">${esc(fallbackText)}</textarea>`);
  return false;
}

  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=='green-uriage'||!o.data||!Array.isArray(o.data.entries))throw 0;
      document.getElementById('restoreArea').innerHTML=`<div class="warnbox">${esc((o.savedAt||'').slice(0,10))} の控え（記録 ${o.data.entries.length}件）に戻します。今のデータは置きかわります。<div class="btnrow" style="margin-top:8px"><button class="btn danger" id="doRestore">戻す</button><button class="btn ghost" data-act="cancelRestore">やめる</button></div></div>`;
      document.getElementById('doRestore').onclick=()=>{S=o.data;save();render();toast('控えから戻しました')};
    }catch(e){toast('このファイルは売上帳の控えではありません')}};
  rd.readAsText(file);
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;closeSheet();render();window.scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  switch(a){
    case 'close':closeSheet();break;
    case 'day':cur=addDays(cur,+t.dataset.n);render();break;
    case 'goToday':cur=TODAY;render();break;
    case 'goDay':cur=t.dataset.d;tab='today';render();window.scrollTo(0,0);break;
    case 'goMonth':month=t.dataset.m;tab='month';render();window.scrollTo(0,0);break;
    case 'month':{const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+(+t.dataset.n),1);month=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'year':year+=+t.dataset.n;render();break;
    case 'new':form({date:cur});break;
    case 'open':form(Object.assign({},S.entries.find(e=>e.id===id)));break;
    case 'fStaff':F.staff=v;document.querySelectorAll('#fStaff button').forEach(b=>b.classList.toggle('on',b===t));break;
    case 'fKind':F.kind=v;document.querySelectorAll('#fKind button').forEach(b=>b.classList.toggle('on',b===t));break;
    case 'fMethod':F.method=v;document.querySelectorAll('#fMethod button').forEach(b=>b.classList.toggle('on',b===t));break;
    case 'fMenu':F.menu=F.menu.includes(v)?F.menu.filter(x=>x!==v):F.menu.concat([v]);if(!F.menu.includes(v))delete F.opts[v];t.classList.toggle('on');F.priceEdited=false;drawOpts();upd();break;
    case 'fOpt':{const mid=t.dataset.mid,o=t.dataset.o,arr=F.opts[mid]||[];F.opts[mid]=arr.includes(o)?arr.filter(x=>x!==o):arr.concat([o]);F.priceEdited=false;drawOpts();upd();break}
    case 'fDisc':F.disc=v;F.priceEdited=false;drawOpts();upd();break;
    case 'save':saveForm();break;
    case 'askDel':document.getElementById('delArea').innerHTML=`<div class="warnbox">本当に消しますか？<div class="btnrow" style="margin-top:8px"><button class="btn danger" data-act="del">消す</button><button class="btn ghost" data-act="close">やめる</button></div></div>`;break;
    case 'del':S.entries=S.entries.filter(e=>e.id!==F.id);save();closeSheet();render();toast('消しました');break;
    case 'exportMonth':exportMonth();break;
    case 'exportYear':exportYear();break;
    case 'exportAll':exportAll();break;
    case 'backup':backup();break;
    case 'cancelRestore':document.getElementById('restoreArea').innerHTML='';break;
    case 'addMenu':S.menus.push({id:uid(),cat:'その他',name:'新しいメニュー',price:0,options:[]});save();render();break;
    case 'delMenu':S.menus.splice(+t.dataset.i,1);save();render();toast('消しました（記録済みの金額はそのまま）');break;
    case 'addOpt':{const m=S.menus[+t.dataset.i];m.options=(m.options||[]).concat([{id:uid(),name:'ロング',price:550}]);save();render();break}
    case 'delOpt':S.menus[+t.dataset.i].options.splice(+t.dataset.j,1);save();render();break;
    case 'addDisc':S.discounts.push({id:uid(),name:'新しい割引',type:'yen',value:500});save();render();break;
    case 'delDisc':S.discounts.splice(+t.dataset.i,1);save();render();break;
    case 'askReset':document.getElementById('resetArea').innerHTML=`<div class="warnbox" style="width:100%">見本の売上を全部消します（料金表はそのまま残ります）。<div class="btnrow" style="margin-top:8px"><button class="btn danger" data-act="reset">消す</button><button class="btn ghost" data-act="cancelReset">やめる</button></div></div>`;break;
    case 'cancelReset':render();break;
    case 'reset':S.entries=S.entries.filter(e=>!e.sample);save();render();toast('見本を消しました');break;
  }
});
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
</body>
